name: av_dev Docker Image

# Builds ghcr.io/<owner>/headscale-admin on every push to av_dev.
# Merge feature branches (e.g. dev-0.29.7) into av_dev to publish them.
on:
  push:
    branches:
      - av_dev
  workflow_dispatch:

concurrency:
  group: av-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.json is out of sync upstream, so `npm ci` would fail
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check -- --threshold error

      - name: Unit tests
        run: npx vitest run

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr requires a lowercase image name
          images: ghcr.io/${{ github.repository_owner }}/headscale-admin
          tags: |
            type=raw,value=latest
            type=raw,value=av_dev
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
